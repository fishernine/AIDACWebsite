<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="description" content="AIDAC RFIC Research Papers - Latest publications in radio frequency integrated circuit design">
        <meta name="keywords" content="RFIC, Research, Papers, AIDAC, Design">
        <meta name="author" content="AIDAC">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AIDAC - RFIC Research Papers</title>

        <!-- Start Include All CSS -->
        <link rel="stylesheet" href="../styles/css/bootstrap.css"/>
        <link rel="stylesheet" href="../styles/css/animate.css"/>
        <link rel="stylesheet" href="../styles/css/font-awesome.css"/>
        <link rel="stylesheet" href="../styles/css/labflox-icon.css"/>
        <link rel="stylesheet" href="../styles/css/owl.theme.default.min.css"/>
        <link rel="stylesheet" href="../styles/css/owl.carousel.min.css"/>
        <link rel="stylesheet" href="../styles/css/slick.css">
        <link rel="stylesheet" href="../styles/css/lightcase.css"/>
        <link rel="stylesheet" href="../styles/css/preloader.css"/>
        
        <!-- Revolution Slider Setting CSS -->
        <link rel="stylesheet" href="../styles/css/settings.css">

        <link rel="stylesheet" href="../styles/css/preset.css"/>
        <link rel="stylesheet" href="../styles/css/ignore_for_wp.css"/>
        <link rel="stylesheet" href="../styles/css/theme.css"/>
        <link rel="stylesheet" href="../styles/css/responsive.css"/>
        <!-- End Include All CSS -->

        <!-- Favicon Icon -->
        <link rel="icon"  type="image/png" href="../assets/images/favicon.png">
        <!-- Favicon Icon -->
        
        <style>
        .paperItem {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .paperItem:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }
        
        .piThumb {
            position: relative;
            overflow: hidden;
            height: 200px;
        }
        
        .piThumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .paperItem:hover .piThumb img {
            transform: scale(1.05);
        }
        
        .piDetails {
            padding: 25px;
        }
        
        .piDate {
            display: inline-block;
            background: #fc3329;
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .piMeta {
            margin-bottom: 15px;
        }
        
        .piMeta span {
            display: inline-block;
            margin-right: 15px;
            font-size: 13px;
            color: #666;
        }
        
        .piMeta i {
            color: #fc3329;
            margin-right: 5px;
        }
        
        .piDetails h3 {
            font-size: 18px;
            line-height: 1.4;
            margin-bottom: 15px;
            color: #222;
        }
        
        .piDetails h3 a {
            color: inherit;
            text-decoration: none;
        }
        
        .piDetails h3 a:hover {
            color: #fc3329;
        }
        
        .paperFooter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .readMore {
            color: #fc3329;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        
        .readMore:hover {
            color: #222;
        }
        
        .citationCount {
            color: #666;
            font-size: 13px;
        }
        
        .citationCount i {
            color: #fc3329;
            margin-right: 5px;
        }

        /* 搜索框样式 */
        .search-container {
            margin-bottom: 30px;
            text-align: center;
        }

        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            border-color: #fc3329;
        }

        /* 无结果样式 */
        .no-results {
            text-align: center;
            padding: 50px 20px;
        }

        .no-results h3 {
            color: #666;
            margin-bottom: 15px;
        }

        .no-results p {
            color: #999;
        }

        /* 分类标签样式 */
        .category-badge {
            display: inline-block;
            background: #fc3329;
            color: #fff;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        </style>
    </head>
    <body>
        <!-- Preloader -->
        <div class="preloader clock text-center">
            <div class="labfloxLoader">
                <div class="loaderO">
                    <span>A</span>
                    <span>I</span>
                    <span>D</span>
                    <span>A</span>
                    <span>C</span>
                </div>
            </div>
        </div>
        
        <!-- Header will be loaded by header-loader.js -->

        <!-- Page Banner Start -->
        <section class="pageBanner">
            <div class="container">
                <div class="row">
                    <div class="col-md-9 col-lg-7 col-xl-7">
                        <div class="pageBannerContent">
                            <h5>RFIC Research</h5>
                            <h2 id="pageTitle">RFIC Design Research Papers</h2>
                            <div class="pageBreadCum">
                                <a href="index.html">Home</a>
                                <i class="fa fa-angle-right"></i>
                                <a href="research.html">Research</a>
                                <i class="fa fa-angle-right"></i>
                                <span>RFIC</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Page Banner End -->

        <!-- Research Papers Section Start -->
        <section class="blogListPage blogList2Col">
            <div class="container">
                <!-- 搜索框 -->
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search RFIC papers by title, author..." id="searchInput">
                </div>

                <!-- 论文列表容器 -->
                <div class="row">
                    <!-- 论文内容将通过JavaScript动态生成 -->
                </div>

                <!-- 分页 -->
                <div class="row">
                    <div class="col-lg-12">
                        <div class="labPagination">
                            <!-- 分页内容将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Research Papers Section End -->

        <!-- Footer will be loaded by footer-loader.js -->
        
        <!-- Back To Top -->
        <a href="javascript:void(0);" id="backtotop"><i class="fa fa-angle-double-up"></i></a>
        <!-- Back To Top -->

        <!-- Start Include All JS -->
        <script src="../scripts/js/jquery.js"></script>
        <script src="../scripts/js/bootstrap.min.js"></script>
        <script src="../scripts/js/owl.carousel.min.js"></script>
        <script src="../scripts/js/jquery.appear.js"></script>
        <script src="../scripts/js/circle-progress.min.js"></script>
        <script src="../scripts/js/slick.js"></script>
        <script src="../scripts/js/lightcase.js"></script>
        <script src="../scripts/js/litepicker.js"></script>
        
        <!-- Slider Revolution Main Files -->
        <script src="../scripts/js/jquery.themepunch.tools.min.js"></script>
        <script src="../scripts/js/jquery.themepunch.revolution.min.js"></script>

        <!-- Slider Revolution Extension -->
        <script src="../scripts/js/extensions/revolution.extension.actions.min.js"></script>
        <script src="../scripts/js/extensions/revolution.extension.carousel.min.js"></script>
        <script src="../scripts/js/extensions/revolution.extension.kenburn.min.js"></script>
        <script src="../scripts/js/extensions/revolution.extension.layeranimation.min.js"></script>
        <script src="../scripts/js/extensions/revolution.extension.migration.min.js"></script>
        <script src="../scripts/js/extensions/revolution.extension.navigation.min.js"></script>
        <script src="../scripts/js/extensions/revolution.extension.parallax.min.js"></script>
        <script src="../scripts/js/extensions/revolution.extension.slideanims.min.js"></script>
        <script src="../scripts/js/extensions/revolution.extension.video.min.js"></script>

        <script src="../scripts/js/theme.js"></script>
        
        <!-- Component Loaders -->
        <script src="../scripts/js/header-loader.js"></script>
        <script src="../scripts/js/footer-loader.js"></script>
        
        <!-- Research Data and Category Renderer -->
        <script src="../scripts/js/research-data.js"></script>
        <script src="../scripts/js/research-category-renderer.js"></script>
        <!-- End Include All JS -->
    </body>
</html>
